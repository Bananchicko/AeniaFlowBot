services:
  aeniaflow-bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/aeniaflow.sqlite3
    volumes:
      - aeniaflow-data:/app/data
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  aeniaflow-data:
